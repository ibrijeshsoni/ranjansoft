version: "3.9"

# Production stack on stock-market-server. Same services as ../podman-compose.yml,
# but runs the images CI publishes to GHCR instead of building locally.
# update.sh (run by the ranjansoft-update timer) pulls new images and recreates these.
# Settings come from deploy/.env (copy of ../.env.example).

services:
  ranjansoft:
    image: ${IMAGE_PREFIX:-ghcr.io/ibrijeshsoni}/ranjansoft-web:${IMAGE_TAG:-latest}
    container_name: ranjansoft-web
    restart: unless-stopped
    ports:
      - "10105:80"
    depends_on:
      - api

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/ibrijeshsoni}/ranjansoft-api:${IMAGE_TAG:-latest}
    container_name: ranjansoft-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
