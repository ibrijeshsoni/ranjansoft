version: "3.9"

# Secrets come from .env (copy .env.example to .env and fill it in).

services:
  ranjansoft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranjansoft-web
    restart: unless-stopped
    ports:
      - "10105:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
    container_name: ranjansoft-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

